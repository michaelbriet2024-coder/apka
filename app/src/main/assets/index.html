<style>
:root{color-scheme:dark;--bg:#0b0f1a;--surface:#111827;--surface2:#172237;--line:#263447;--text:#eef7ff;--muted:#8fa1b7;--green:#61e9a7;--cyan:#54cde8;--purple:#b19bff;--gold:#ffcd75;--red:#ff7a88;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body:before{content:"";position:fixed;width:65vmax;height:65vmax;right:-24vmax;top:-34vmax;pointer-events:none;background:radial-gradient(circle,#124d46aa,transparent 66%);z-index:0}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.975)}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}#app{max-width:1100px;margin:auto;position:relative;z-index:1;min-height:100vh;display:grid;grid-template-columns:238px 1fr}.sidebar{background:#0e1726bf;border-right:1px solid var(--line);padding:28px 17px;min-height:100vh;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:10px 10px 24px}.brandlogo{height:43px;width:43px;border-radius:13px;background:linear-gradient(145deg,#164b42,#0b2d37);display:grid;place-items:center;font-size:22px;color:var(--green);box-shadow:inset 0 0 0 1px #357d6973}.brand strong{display:block;font-size:17px;letter-spacing:-.5px}.brand small{color:var(--muted);font-size:11px;letter-spacing:1.1px}.nav{display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:13px 14px;border-radius:12px;color:#b6c7db;font-weight:600;display:flex;align-items:center;gap:12px;transition:.15s}.nav button.active{background:#193c3b;color:#b4ffe1}.nav button:hover:not(.active){background:#192435}.ico{font-size:18px;width:20px;text-align:center}.sidebar-footer{margin-top:auto;border:1px solid #254a4b;background:#102728;border-radius:15px;padding:15px}.sidebar-footer strong{font-size:13px}.sidebar-footer p{font-size:12px;color:#a2b9b8;line-height:1.5;margin:7px 0 0}.main{padding:34px 38px 80px;min-width:0}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800}.top-user{display:flex;gap:8px;align-items:center;color:#c2d0df;font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#1f3c44;color:var(--green);font-weight:800;border:1px solid #396877}h1{font-size:clamp(27px,4vw,42px);line-height:1.15;letter-spacing:-1.5px;margin:7px 0 12px}h2{font-size:20px;letter-spacing:-.6px;margin:0}p{line-height:1.55}.muted{color:var(--muted)}.hero{border:1px solid #315a61;border-radius:22px;display:grid;grid-template-columns:1fr 160px;align-items:center;gap:10px;overflow:hidden;background:linear-gradient(110deg,#183d3b,#112538 77%);padding:27px 30px;margin:15px 0 20px;position:relative}.hero:after{content:"";position:absolute;right:-55px;top:-74px;width:300px;height:300px;border:1px solid #ffffff13;border-radius:50%;box-shadow:0 0 0 40px #ffffff05,0 0 0 80px #ffffff05}.hero h1{margin-top:9px}.hero p{max-width:510px;margin:0 0 20px;color:#c0d7d8;font-size:14px}.hero-art{font-family:monospace;font-size:73px;color:#79f4bf;text-align:center;text-shadow:0 0 32px #57eca877;z-index:1}.primary,.secondary,.ghost{border-radius:11px;padding:12px 18px;font-weight:800;font-size:13px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .12s}.primary{background:var(--green);color:#092921}.primary:hover{background:#8bf9c3}.secondary{background:#1b2b3c;color:#d5e7ef;border-color:#334b5e}.ghost{background:transparent;color:var(--green);border-color:#33544c}.section-head{display:flex;justify-content:space-between;align-items:center;margin:29px 0 14px;gap:10px}.section-head small{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:17px 19px}.stat-label{font-size:11px;font-weight:750;color:var(--muted);letter-spacing:.5px}.stat-number{font-size:27px;font-weight:850;letter-spacing:-.9px;margin:7px 0}.stat-note{color:var(--muted);font-size:11px}.track-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.track{background:linear-gradient(145deg,#152235,#111b2a);border:1px solid var(--line);border-radius:17px;padding:19px;text-align:left;color:var(--text);transition:border-color .15s,transform .15s}.track:hover{border-color:#4d8a7f;transform:translateY(-2px)}.track-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.track-symbol{height:41px;width:41px;display:grid;place-items:center;border-radius:12px;font-size:20px}.track-title{font-size:15px;font-weight:800}.track-desc{font-size:12px;color:var(--muted);margin:6px 0 14px;min-height:17px}.progress{height:6px;background:#2a3547;border-radius:5px;overflow:hidden}.progress span{height:100%;display:block;border-radius:6px;background:var(--green);transition:width .3s}.track-bottom{display:flex;justify-content:space-between;color:#98aabf;font-size:11px;margin-top:10px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:21px}.lesson-list{display:grid;gap:10px}.lesson{width:100%;color:var(--text);background:#151f30;border:1px solid #293b4f;display:flex;gap:14px;text-align:left;padding:15px;border-radius:13px;align-items:center}.lesson:hover{border-color:#518e7d}.lesson-num{border-radius:11px;background:#213546;color:#8fd6c2;min-width:41px;height:41px;display:grid;place-items:center;font-weight:800}.lesson.done .lesson-num{background:#183d31;color:var(--green)}.lesson-title{font-weight:800;font-size:14px}.lesson-desc{font-size:12px;color:var(--muted);margin-top:4px}.push{margin-left:auto}.pill{display:inline-flex;align-items:center;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:750;background:#1c3c3b;color:#9df3cb}.lesson-content{background:#151f30;border:1px solid var(--line);border-radius:18px;padding:25px;margin-top:20px}.lesson-content p{font-size:15px;color:#cedce9}.lesson-content h3{font-size:17px;color:#d9fff1;margin-top:26px}.code{font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;border:1px solid #2b4554;background:#0a1421;border-radius:12px;padding:16px;overflow-x:auto;color:#89ecc0;white-space:pre-wrap;overflow-wrap:anywhere}.callout{border-left:3px solid var(--green);background:#19332e;padding:15px 18px;border-radius:0 9px 9px 0;color:#cceee3;font-size:13px;margin-top:16px}.option{width:100%;text-align:left;border:1px solid #324354;background:#192639;color:#e2edf6;padding:15px;border-radius:12px;margin-top:9px;transition:.12s}.option.selected{border-color:var(--green);background:#1d3a35}.option.wrong{border-color:var(--red);background:#452733}.option.correct{border-color:var(--green);background:#1b4133}.feedback{font-size:13px;margin:13px 0;padding:12px;border-radius:9px;background:#15352b;color:#b5f3ce}.feedback.bad{background:#3a222a;color:#ffd2d5}.terminal{background:#080d14;border:1px solid #31526a;border-radius:15px;margin:16px 0;overflow:hidden}.terminal-bar{background:#182535;padding:10px 15px;font-size:12px;color:#a5b9c8;display:flex;align-items:center;gap:9px}.dots{display:flex;gap:5px}.dots span{height:8px;width:8px;background:#e86e78;border-radius:50%}.dots span:nth-child(2){background:#f3c269}.dots span:nth-child(3){background:#62d6a2}.terminal-log{min-height:145px;max-height:250px;overflow:auto;padding:14px 16px;color:#a5dccc;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.terminal-entry{display:flex;border-top:1px solid #253747;padding:11px 15px;align-items:center;gap:7px}.terminal-entry label{font:12px monospace;color:var(--green)}.terminal-entry input{background:transparent;border:0;color:#edfdf7;min-width:0;flex:1;outline:none;font:13px monospace}.terminal-entry button{border:0;background:#204e40;color:#b1f5d3;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700}.mission{background:#20312e;border:1px solid #335e54;border-radius:12px;padding:15px;color:#bfeeda;font-size:13px}.mission strong{color:var(--green)}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.back{background:none;border:none;color:#9ac5bf;font-weight:700;padding:6px 0;margin-bottom:12px}.setrow{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:20px 0;border-bottom:1px solid var(--line)}.switch{width:48px;height:28px;border-radius:99px;border:1px solid #506376;background:#273444;position:relative;flex:none}.switch.on{background:#157959;border-color:#2cbe83}.switch:after{content:"";width:20px;height:20px;position:absolute;top:3px;left:4px;background:white;border-radius:50%;transition:left .15s}.switch.on:after{left:22px}.bottomnav{display:none}.toast{position:fixed;z-index:99;bottom:27px;left:50%;transform:translateX(-50%) translateY(20px);background:#254337;border:1px solid #5aa889;color:#d8ffed;padding:12px 18px;border-radius:11px;font-size:13px;box-shadow:0 12px 30px #0008;opacity:0;pointer-events:none;transition:.22s;max-width:calc(100vw - 30px);text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.badgegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.badgeitem{background:#172235;border:1px solid #334052;border-radius:13px;padding:17px;text-align:center}.badgeitem.locked{opacity:.45}.badgeitem .badgeicon{font-size:30px;margin-bottom:8px}.badgeitem strong{display:block;font-size:12px}.badgeitem small{font-size:11px;color:#9cb2c8}.footer-note{font-size:11px;color:#617b8d;text-align:center;margin-top:34px}@media(max-width:810px){#app{display:block}.sidebar{display:none}.main{padding:20px 18px 110px}.hero{padding:22px 20px;grid-template-columns:1fr 65px}.hero-art{font-size:47px}.hero h1{font-size:29px}.stats{gap:8px}.stat{padding:14px}.stat-number{font-size:22px}.track-grid{gap:9px}.track{padding:14px}.track-desc{min-height:32px}.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:#101b2bec;backdrop-filter:blur(14px);border-top:1px solid #2d3d4c;justify-content:space-around;padding:8px 6px calc(7px + env(safe-area-inset-bottom))}.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:4px;color:#94a5b8;background:none;border:0;padding:6px 9px;font-size:10px;font-weight:700}.bottomnav button .ico{font-size:20px}.bottomnav button.active{color:var(--green)}.toast{bottom:87px}}@media(max-width:380px){.main{padding:17px 13px 105px}.hero-art{display:none}.hero{display:block}.track-title{font-size:13px}.track-symbol{height:37px;width:37px}.stat-label{font-size:10px}.stat-note{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>

<script>
'use strict';
const TRACKS=[
{id:'python',name:'Programação',short:'Python e lógica de código',icon:'⌘',color:'#69aafc',lessons:[
{id:'py1',title:'Seu primeiro código',time:'5 min',description:'Entenda o que é programar e use print().',intro:'Programar é escrever instruções que um computador executa. Em Python, a função <b>print()</b> exibe uma mensagem na tela.',example:'print("Olá, mundo!")',tip:'O texto entre aspas é uma string (sequência de caracteres).',question:'Qual comando mostra um texto na tela em Python?',choices:['print("Olá")','show("Olá")','echo "Olá"'],answer:0,explain:'Em Python, print() mostra valores no console.'},
{id:'py2',title:'Variáveis e dados',time:'6 min',description:'Guarde e reutilize informações.',intro:'Uma <b>variável</b> associa um nome a um valor. É possível armazenar textos, números e resultados de expressões.',example:'nome = "Ana"\nidade = 25\nprint(nome)',tip:'Em Python, o sinal = atribui um valor à variável.',question:'Qual linha cria uma variável chamada idade com o número 25?',choices:['idade == 25','idade = 25','var(idade,25)'],answer:1,explain:'O sinal = realiza a atribuição.'},
{id:'py3',title:'Condições e decisões',time:'7 min',description:'Aprenda if, else e comparações.',intro:'Condições permitem executar código apenas quando uma expressão é verdadeira. A indentação organiza os blocos em Python.',example:'senha_forte = True\nif senha_forte:\n    print("Boa escolha!")\nelse:\n    print("Melhore a senha")',tip:'Nunca armazene senhas reais em texto puro no código.',question:'Qual palavra inicia uma condição em Python?',choices:['if','when','case'],answer:0,explain:'if inicia uma condição; else trata o outro caso.'}]},
{id:'linux',name:'Linux e Redes',short:'Terminal, arquivos e internet',icon:'>_',color:'#ffd17a',lessons:[
{id:'lx1',title:'Conhecendo o terminal',time:'5 min',description:'Comandos pwd, ls e cat.',intro:'O terminal permite controlar o sistema por comandos. <b>pwd</b> informa a pasta atual; <b>ls</b> lista os arquivos; <b>cat</b> exibe o conteúdo de um arquivo.',example:'pwd\nls\ncat README.txt',tip:'Os comandos do laboratório funcionam somente em um computador fictício.',question:'Qual comando lista os arquivos de uma pasta?',choices:['ls','pwd','cd'],answer:0,explain:'ls lista o conteúdo do diretório.'},
{id:'lx2',title:'O que é um endereço IP?',time:'6 min',description:'Fundamentos de conexões de rede.',intro:'Um endereço IP identifica uma interface de rede no contexto de uma conexão. O protocolo IP permite que pacotes sejam encaminhados entre redes.',example:'Exemplo de IP privado: 192.168.1.10\nExemplo de domínio: exemplo.com',tip:'Um endereço privado não identifica publicamente uma pessoa específica.',question:'Qual é um exemplo de endereço IPv4?',choices:['192.168.1.10','https://','AA:BB:CC:DD'],answer:0,explain:'IPv4 normalmente usa quatro números decimais separados por pontos.'},
{id:'lx3',title:'Portas e protocolos',time:'6 min',description:'HTTPS, DNS e conexões.',intro:'Portas ajudam a distinguir serviços em uma conexão. HTTPS protege a comunicação web com TLS. DNS traduz nomes de domínio para dados como endereços IP.',example:'HTTPS: normalmente porta 443\nDNS: frequentemente porta 53',tip:'Uma porta aberta não prova, por si só, que existe uma vulnerabilidade.',question:'Qual protocolo costuma proteger a navegação web?',choices:['FTP','HTTPS','Telnet'],answer:1,explain:'HTTPS usa TLS para proteger a comunicação.'}]},
{id:'security',name:'Hacking ético',short:'Defesa e análise autorizada',icon:'⬡',color:'#61e9a7',lessons:[
{id:'se1',title:'O que é hacking ético?',time:'5 min',description:'Permissões e limites legais.',intro:'Hacking ético é a análise de segurança realizada <b>com autorização explícita e escopo definido</b>. Seu objetivo é encontrar e comunicar falhas para que possam ser corrigidas.',example:'Escopo autorizado:\n- laboratório pessoal\n- sistema de teste\n- permissão por escrito',tip:'Não teste sites, redes ou contas de terceiros sem autorização.',question:'Antes de testar a segurança de um site de outra pessoa, você precisa de:',choices:['Uma VPN','Autorização explícita','Um navegador diferente'],answer:1,explain:'Permissão e escopo definido são indispensáveis.'},
{id:'se2',title:'Senhas e autenticação',time:'7 min',description:'Proteja contas e acessos.',intro:'Uma senha forte deve ser longa e única. Autenticação multifator (MFA) acrescenta uma barreira caso a senha seja descoberta.',example:'Práticas defensivas:\n✓ gerenciador de senhas\n✓ MFA\n✓ senhas únicas',tip:'Uma frase longa e exclusiva tende a ser melhor que uma senha curta e previsível.',question:'Qual medida aumenta a proteção de uma conta?',choices:['Reutilizar senhas','Ativar MFA','Compartilhar códigos de acesso'],answer:1,explain:'MFA adiciona uma segunda verificação.'},
{id:'se3',title:'Identificando phishing',time:'7 min',description:'Reconheça mensagens suspeitas.',intro:'Phishing é uma tentativa de enganar pessoas para obter informações ou levá-las a clicar em links maliciosos. Procure urgência artificial, domínio inconsistente e pedidos de dados sensíveis.',example:'Mensagem suspeita:\n"Sua conta será bloqueada HOJE!\nEnvie o código de verificação."',tip:'Acesse serviços digitando o endereço oficial, não por links suspeitos.',question:'Qual é um sinal frequente de phishing?',choices:['Um pedido inesperado de código MFA','Um aviso dentro do app oficial','Um comprovante solicitado por você'],answer:0,explain:'Códigos de autenticação não devem ser compartilhados.'}]},
{id:'forensics',name:'Perícia digital',short:'Evidências e investigação',icon:'◎',color:'#b9a1ff',lessons:[
{id:'fo1',title:'O que é perícia digital?',time:'5 min',description:'Evidências e cadeia de custódia.',intro:'A perícia digital examina dados relevantes para uma investigação. Para preservar evidências, deve-se documentar como foram obtidas e evitar alterações desnecessárias.',example:'Fluxo geral:\nIdentificar → Preservar → Coletar\n→ Analisar → Documentar',tip:'Cadeia de custódia registra o histórico de manuseio da evidência.',question:'Qual é a primeira preocupação ao coletar uma evidência?',choices:['Editar o arquivo original','Preservar sua integridade','Publicá-la online'],answer:1,explain:'A integridade é crucial para confiar no resultado da análise.'},
{id:'fo2',title:'Metadados de imagens',time:'6 min',description:'Conheça o que arquivos revelam.',intro:'Metadados são informações sobre um arquivo, como formato, resolução, dispositivo e, às vezes, data e localização. Eles podem estar ausentes ou ter sido modificados.',example:'Arquivo: foto_001.jpg\nTamanho: 2048 × 1536\nCriado: 2026-09-13 11:42\nGPS: não registrado',tip:'Um metadado isolado não comprova o que aconteceu.',question:'Qual destas informações pode aparecer em metadados de fotos?',choices:['Coordenadas GPS, se gravadas','A intenção do fotógrafo','Uma prova incontestável de autoria'],answer:0,explain:'Coordenadas podem constar dos metadados quando salvas pelo dispositivo.'},
{id:'fo3',title:'Hash e integridade',time:'7 min',description:'Identifique alterações em arquivos.',intro:'Uma função hash calcula uma representação de tamanho fixo de dados. Em análises forenses, hashes criptográficos ajudam a verificar se arquivos foram alterados.',example:'SHA-256(arquivo) → resumo hexadecimal\nCompare o hash antes e depois.',tip:'O hash não informa sozinho quem criou ou modificou o arquivo.',question:'Para que serve comparar hashes de dois arquivos?',choices:['Comparar sua integridade','Descobrir o dono da máquina','Recuperar qualquer senha'],answer:0,explain:'Hashes iguais são um forte indicativo de conteúdo igual, conforme o algoritmo utilizado.'}]},
{id:'web',name:'Segurança Web',short:'Navegadores, sites e APIs',icon:'◇',color:'#5cdbde',lessons:[
{id:'wb1',title:'Como um site funciona?',time:'6 min',description:'Cliente, servidor e HTTP.',intro:'O navegador solicita recursos de um servidor por HTTP ou HTTPS. O servidor devolve uma resposta que pode conter HTML, CSS, JavaScript ou dados.',example:'Navegador → pedido HTTPS\nServidor → resposta HTTP 200',tip:'Códigos HTTP indicam categorias de resultado, não garantem que o conteúdo é seguro.',question:'Qual código geralmente significa que a solicitação foi bem-sucedida?',choices:['404','500','200'],answer:2,explain:'HTTP 200 representa sucesso da solicitação.'},
{id:'wb2',title:'Entrada de dados segura',time:'7 min',description:'Validação e saída segura.',intro:'Aplicativos recebem dados de usuários. Desenvolvedores devem validar entradas e codificar saídas conforme o contexto para evitar falhas como injeção de conteúdo.',example:'Princípio: nunca presumir que\na entrada do usuário é confiável.',tip:'Use consultas parametrizadas para acessar bancos de dados.',question:'Qual prática ajuda a prevenir SQL injection?',choices:['Consultas parametrizadas','Montar SQL concatenando texto','Remover logs'],answer:0,explain:'Consultas parametrizadas separam dados das instruções SQL.'}]},
{id:'logic',name:'Lógica e Algoritmos',short:'Aprenda a pensar como dev',icon:'◫',color:'#ff9bc7',lessons:[
{id:'lo1',title:'O que é um algoritmo?',time:'5 min',description:'Sequência de passos e soluções.',intro:'Um algoritmo é um conjunto de etapas organizadas para resolver um problema. Ele pode ser descrito em linguagem natural, fluxograma ou código.',example:'Receita de algoritmo:\n1. Ler dois números\n2. Somar\n3. Mostrar resultado',tip:'Clareza e previsibilidade são partes de uma boa solução.',question:'Qual descrição melhor define um algoritmo?',choices:['Uma sequência de instruções','Somente um aplicativo','Uma conexão de rede'],answer:0,explain:'Algoritmos descrevem passos para realizar tarefas.'},
{id:'lo2',title:'Repetições',time:'6 min',description:'Faça tarefas sem repetir código.',intro:'Laços executam um bloco de instruções várias vezes. A condição de parada evita repetições infinitas.',example:'for numero in range(3):\n    print(numero)',tip:'range(3) produz 0, 1 e 2.',question:'Quantas vezes esse for executa o print?',choices:['2','3','4'],answer:1,explain:'O laço itera sobre três números: 0, 1 e 2.'}]}];
const MISSIONS=[
{id:'lab1',track:'linux',title:'Encontrar o relatório',level:'Iniciante',intro:'Você recebeu acesso a um computador fictício. Leia o arquivo README.txt no terminal.',goal:'cat README.txt',reward:40,commands:['help','pwd','ls','cat README.txt','whoami']},
{id:'lab2',track:'linux',title:'Identidade do usuário',level:'Iniciante',intro:'Descubra o usuário atual do terminal fictício.',goal:'whoami',reward:30,commands:['help','pwd','ls','cat README.txt','whoami']},
{id:'lab3',track:'python',title:'Seu primeiro programa',level:'Iniciante',intro:'Execute um print para mostrar Olá, mundo! no console simulado.',goal:'print("Olá, mundo!")',reward:40,commands:['help','print("Olá, mundo!")','print("Oi")']},
{id:'lab4',track:'forensics',title:'A pista no arquivo',level:'Investigador',intro:'Inspecione os metadados da fotografia fictícia e identifique o horário registrado.',goal:'metadados foto.jpg',reward:50,commands:['help','ls','metadados foto.jpg']},
{id:'lab5',track:'security',title:'Proteção da conta',level:'Iniciante',intro:'No laboratório de conscientização, escolha uma prática adicional de proteção de login.',goal:'ativar mfa',reward:35,commands:['help','verificar conta','ativar mfa']}];
const NAV=[['home','⌂','Início'],['tracks','▦','Trilhas'],['labs','⌘','Laboratório'],['profile','♧','Perfil'],['settings','⚙','Ajustes']];
const STORAGE_KEY='hacklab-academy-v1';
function load(){try{let v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');return {done:Array.isArray(v.done)?v.done:[],labs:Array.isArray(v.labs)?v.labs:[],vibration:v.vibration!==false,name:typeof v.name==='string'?v.name:'Estudante'};}catch(e){return {done:[],labs:[],vibration:true,name:'Estudante'};}}
let state=load(),screen={page:'home'},navStack=[],quizChoice=-1,quizAnswered=false,termLines=[],toastTimer;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
function vibrate(){if(!state.vibration)return;try{if(window.Android&&typeof window.Android.haptic==='function'){window.Android.haptic();}else if(navigator.vibrate){navigator.vibrate(16);}}catch(e){}}
function q(s){return document.querySelector(s)};
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function stats(){const xp=state.done.length*25+state.labs.reduce((n,id)=>n+(MISSIONS.find(m=>m.id===id)?.reward||0),0);const n=state.done.length+state.labs.length;return {xp,n,level:Math.floor(xp/200)+1};}
function allLessons(){return TRACKS.flatMap(t=>t.lessons.map(l=>({...l,track:t.id,trackName:t.name})));}
function getLesson(id){return allLessons().find(l=>l.id===id)}
function perc(t){return Math.round(t.lessons.filter(l=>state.done.includes(l.id)).length/t.lessons.length*100)}
function toast(msg){let e=q('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2400)}
function navigate(page,id){vibrate();navStack.push({...screen});screen={page,id};quizChoice=-1;quizAnswered=false;termLines=[];render();window.scrollTo({top:0,behavior:'instant'});}
window.hacklabBack=function(){if(!navStack.length)return false;screen=navStack.pop();quizChoice=-1;quizAnswered=false;termLines=[];render();window.scrollTo({top:0,behavior:'instant'});return true;};
function menu(){for(let el of [q('#desktopnav'),q('#mobilenav')])el.innerHTML=NAV.map(([page,icon,label])=>`<button data-go="${page}" class="${screen.page===page||((screen.page==='track'||screen.page==='lesson')&&page==='tracks')||((screen.page==='lab')&&page==='labs')?'active':''}"><span class="ico">${icon}</span>${label}</button>`).join('');}
function header(k='CENTRO DE APRENDIZADO'){let s=stats();return `<div class="topline"><span class="eyebrow">${k}</span><span class="top-user">Nível ${s.level}<span class="avatar">HL</span></span></div>`;}
function trackCard(t){let p=perc(t);return `<button class="track" data-track="${t.id}" aria-label="Abrir ${t.name}"><div class="track-top"><span class="track-symbol" style="background:${t.color}18;color:${t.color}">${t.icon}</span><span style="color:#68869b;font-size:16px">↗</span></div><div class="track-title">${t.name}</div><div class="track-desc">${t.short}</div><div class="progress"><span style="width:${p}%;background:${t.color}"></span></div><div class="track-bottom"><span>${t.lessons.filter(l=>state.done.includes(l.id)).length}/${t.lessons.length} aulas</span><span>${p}%</span></div></button>`;}
function home(){const s=stats(),next=allLessons().find(l=>!state.done.includes(l.id))||allLessons()[0];return header()+`<section class="hero"><div><span class="eyebrow">SUA JORNADA COMEÇA AQUI</span><h1>Aprenda a pensar<br>como um hacker <span style="color:var(--green)">ético.</span></h1><p>Programação, investigação digital e segurança em missões práticas, do básico ao avançado.</p><button class="primary" data-lesson="${next.id}">▶ ${state.done.length?'Continuar aprendendo':'Começar primeira aula'}</button></div><div class="hero-art">{ }</div></section><div class="stats"><div class="stat"><div class="stat-label">EXPERIÊNCIA</div><div class="stat-number" style="color:var(--green)">${s.xp} XP</div><div class="stat-note">Nível ${s.level}</div></div><div class="stat"><div class="stat-label">AULAS</div><div class="stat-number">${state.done.length}<span class="muted" style="font-size:15px">/${allLessons().length}</span></div><div class="stat-note">Concluídas</div></div><div class="stat"><div class="stat-label">MISSÕES</div><div class="stat-number">${state.labs.length}<span class="muted" style="font-size:15px">/${MISSIONS.length}</span></div><div class="stat-note">Resolvidas</div></div></div><div class="section-head"><h2>Trilhas de aprendizado</h2><button class="ghost" data-go="tracks">Ver todas →</button></div><div class="track-grid">${TRACKS.slice(0,4).map(trackCard).join('')}</div><div class="section-head"><h2>Pratique agora</h2></div><div class="card" style="background:linear-gradient(110deg,#182a31,#142136)"><div class="flex" style="justify-content:space-between"><div><span class="eyebrow">MISSÃO SIMULADA</span><h2 style="margin:9px 0">Seu primeiro terminal</h2><p class="muted" style="font-size:13px;margin:0 0 14px">Explore arquivos e conclua tarefas em um computador fictício.</p><button class="secondary" data-lab="lab1">Abrir laboratório →</button></div><div style="font-size:55px;color:var(--green);padding:10px">⌘</div></div></div>`;}
function tracksPage(){return header('ACADEMIA')+`<h1>Suas trilhas</h1><p class="muted">Escolha um tema, estude no seu ritmo e marque cada aula como concluída.</p><div class="track-grid" style="margin-top:22px">${TRACKS.map(trackCard).join('')}</div>`;}
function trackPage(id){const t=TRACKS.find(t=>t.id===id);if(!t)return tracksPage();return header('TRILHA DE APRENDIZADO')+`<button class="back" data-go="tracks">← Voltar às trilhas</button><div class="flex"><span class="track-symbol" style="background:${t.color}18;color:${t.color};font-size:27px">${t.icon}</span><div><h1 style="margin:0">${t.name}</h1><p class="muted" style="margin:5px 0">${t.short}</p></div></div><div class="card" style="margin:20px 0"><div class="flex" style="justify-content:space-between"><strong>Progresso da trilha</strong><span class="pill">${perc(t)}%</span></div><div class="progress" style="margin-top:13px"><span style="width:${perc(t)}%"></span></div></div><div class="section-head"><h2>Aulas desta trilha</h2><small>${t.lessons.length} aulas</small></div><div class="lesson-list">${t.lessons.map((l,i)=>`<button class="lesson ${state.done.includes(l.id)?'done':''}" data-lesson="${l.id}"><span class="lesson-num">${state.done.includes(l.id)?'✓':String(i+1).padStart(2,'0')}</span><span><span class="lesson-title">${l.title}</span><div class="lesson-desc">${l.description} · ${l.time}</div></span><span class="push" style="color:var(--green)">→</span></button>`).join('')}</div>`;}
function lessonPage(id){let l=getLesson(id);if(!l)return tracksPage();const t=TRACKS.find(x=>x.id===l.track);return header('AULA INTERATIVA')+`<button class="back" data-track="${l.track}">← Voltar à trilha</button><span class="pill">${t.name} · ${l.time}</span><h1>${l.title}</h1><p class="muted">${l.description}</p><div class="lesson-content"><h2>Entenda o conceito</h2><p>${l.intro}</p><h3>Exemplo prático</h3><pre class="code">${safe(l.example)}</pre><div class="callout"><b>💡 Dica:</b> ${l.tip}</div><div class="section-head"><h2>Teste seu conhecimento</h2><small>+25 XP ao acertar</small></div><p style="color:#e4f0f9"><b>${l.question}</b></p><div id="answers">${l.choices.map((c,i)=>`<button class="option" data-choice="${i}">${String.fromCharCode(65+i)}. ${safe(c)}</button>`).join('')}</div><div id="answerFeedback"></div><div class="flex" style="margin-top:19px"><button class="primary" id="checkAnswer">Verificar resposta</button><button class="secondary" data-track="${l.track}">Voltar às aulas</button></div></div>`;}
function labsPage(){return header('MODO LABORATÓRIO')+`<h1>Missões práticas <span style="color:var(--green)">⌘</span></h1><p class="muted">Simule comandos e investigue pistas sem acessar máquinas, redes ou sites reais.</p><div class="mission" style="margin:21px 0"><strong>Ambiente isolado e fictício.</strong> Nenhum comando enviado aqui é executado no sistema ou na internet.</div><div class="lesson-list">${MISSIONS.map(m=>`<button class="lesson ${state.labs.includes(m.id)?'done':''}" data-lab="${m.id}"><span class="lesson-num">${state.labs.includes(m.id)?'✓':'⌘'}</span><span><span class="lesson-title">${m.title}</span><div class="lesson-desc">${m.level} · +${m.reward} XP</div></span><span class="push" style="color:var(--green)">→</span></button>`).join('')}</div>`;}
function labPage(id){let m=MISSIONS.find(l=>l.id===id);if(!m)return labsPage();return header('LABORATÓRIO INTERATIVO')+`<button class="back" data-go="labs">← Voltar às missões</button><span class="pill">${m.level} · +${m.reward} XP</span><h1>${m.title}</h1><p class="muted">${m.intro}</p><div class="mission"><strong>Objetivo:</strong> ${m.id==='lab1'?'Leia o conteúdo do README.txt':m.id==='lab2'?'Descubra quem é o usuário atual':m.id==='lab3'?'Mostre a mensagem “Olá, mundo!”':m.id==='lab4'?'Encontre a informação de data e hora do arquivo':'Ative a autenticação multifator na conta fictícia'}.</div><div class="terminal"><div class="terminal-bar"><div class="dots"><span></span><span></span><span></span></div> hacklab@simulador:~</div><div class="terminal-log" id="terminalLog">${safe(termLines.join('\n'))}</div><form class="terminal-entry" id="terminalForm"><label for="cmd">$</label><input id="cmd" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="digite help e pressione Enter" aria-label="Comando no simulador"/><button type="submit">Executar ↵</button></form></div><div class="flex"><button class="secondary" id="terminalHelp">Ver comandos disponíveis</button><button class="ghost" id="terminalReset">Limpar terminal</button></div><div class="callout">Este terminal responde apenas a comandos predefinidos. É um jogo educativo, não um shell real.</div>`;}
function profilePage(){let s=stats();let badges=[['🥇','Primeiros passos',state.done.length>=1],['📚','Estudante dedicado',state.done.length>=5],['⌘','Explorador do terminal',state.labs.length>=1],['🛡','Guardião digital',state.done.some(id=>id.startsWith('se'))],['🔎','Investigador',state.done.some(id=>id.startsWith('fo'))],['🏆','Mestre da academia',state.done.length===allLessons().length&&state.labs.length===MISSIONS.length]];return header('SEU PERFIL')+`<h1>Seu progresso</h1><div class="card" style="margin:20px 0;background:linear-gradient(110deg,#163c39,#172036)"><div class="flex"><span class="avatar" style="width:57px;height:57px;font-size:23px">HL</span><div><h2>${safe(state.name)}</h2><span class="muted">Nível ${s.level} · ${s.xp} XP acumulados</span></div></div><div class="progress" style="margin:21px 0 8px"><span style="width:${s.xp%200/2}%"></span></div><small class="muted">${s.xp%200}/200 XP para o próximo nível</small></div><div class="stats"><div class="stat"><div class="stat-label">AULAS</div><div class="stat-number">${state.done.length}</div></div><div class="stat"><div class="stat-label">MISSÕES</div><div class="stat-number">${state.labs.length}</div></div><div class="stat"><div class="stat-label">MEDALHAS</div><div class="stat-number">${badges.filter(b=>b[2]).length}</div></div></div><div class="section-head"><h2>Conquistas</h2></div><div class="badgegrid">${badges.map(([icon,title,unlocked])=>`<div class="badgeitem ${unlocked?'':'locked'}"><div class="badgeicon">${icon}</div><strong>${title}</strong><small>${unlocked?'Desbloqueada':'Bloqueada'}</small></div>`).join('')}</div>`;}
function settingsPage(){return header('PREFERÊNCIAS')+`<h1>Configurações</h1><div class="card" style="margin-top:20px"><div class="setrow"><div><strong>Vibração ao tocar</strong><p class="muted" style="font-size:12px;margin:5px 0">Feedback tátil breve nos botões. Depende do aparelho.</p></div><button id="vibrationToggle" class="switch ${state.vibration?'on':''}" role="switch" aria-label="Vibração ao tocar" aria-checked="${state.vibration}"></button></div><div class="setrow"><div><strong>Dados salvos neste aparelho</strong><p class="muted" style="font-size:12px;margin:5px 0">Seu progresso fica localmente no aplicativo.</p></div><span class="pill">Offline</span></div><div class="setrow" style="border-bottom:0"><div><strong>Reiniciar progresso</strong><p class="muted" style="font-size:12px;margin:5px 0">Apaga aulas e missões concluídas neste dispositivo.</p></div><button class="secondary" id="resetProgress">Reiniciar</button></div></div><div class="card" style="margin-top:15px"><strong>Sobre o HackLab Academy</strong><p class="muted" style="font-size:13px">Versão 1.0 · Criado por BrietLabs. Conteúdo introdutório de programação, defesa e investigação digital em simulações educativas.</p></div>`;}
function render(){menu();let html=screen.page==='home'?home():screen.page==='tracks'?tracksPage():screen.page==='track'?trackPage(screen.id):screen.page==='lesson'?lessonPage(screen.id):screen.page==='labs'?labsPage():screen.page==='lab'?labPage(screen.id):screen.page==='profile'?profilePage():settingsPage();q('#view').innerHTML=html+`<div class="footer-note">HackLab Academy · BrietLabs · Aprenda com responsabilidade.</div>`;if(screen.page==='lab'){if(!termLines.length){termLines=['HackLab OS 1.0 — simulador educacional','Digite help para ver os comandos disponíveis.'];q('#terminalLog').textContent=termLines.join('\n');}}}
function checkQuiz(){if(screen.page!=='lesson')return;let l=getLesson(screen.id);if(quizChoice<0){toast('Escolha uma alternativa primeiro.');return;}let success=quizChoice===l.answer;quizAnswered=true;document.querySelectorAll('[data-choice]').forEach(btn=>{let i=Number(btn.dataset.choice);btn.classList.toggle('correct',i===l.answer);btn.classList.toggle('wrong',i===quizChoice&&!success);btn.disabled=true;});q('#checkAnswer').disabled=true;q('#answerFeedback').innerHTML=`<div class="feedback ${success?'':'bad'}">${success?'✓ Resposta correta! '+(state.done.includes(l.id)?'Aula já concluída.':'+25 XP conquistados.'):'✕ Ainda não. '} ${l.explain}</div>${success?'<button class="primary" id="nextLesson" style="margin-top:8px">Continuar →</button>':'<button class="secondary" id="retryQuiz" style="margin-top:8px">Tentar novamente</button>'}`;if(success&&!state.done.includes(l.id)){state.done.push(l.id);save();vibrate();toast('Aula concluída! +25 XP');}}
function runTerminal(raw){const m=MISSIONS.find(l=>l.id===screen.id);if(!m)return;let cmd=raw.trim().replace(/\s+/g,' ');if(!cmd)return;termLines.push('$ '+cmd);let output='Comando não reconhecido neste simulador. Use help.';let normalized=cmd.toLocaleLowerCase('pt-BR');if(normalized==='help')output='Comandos deste exercício:\n'+m.commands.join('\n');else if(normalized==='pwd')output='/home/hacklab';else if(normalized==='ls')output=m.id==='lab4'?'foto.jpg    notas.txt':'README.txt    projetos/    notas.txt';else if(normalized==='whoami')output='estudante';else if(normalized==='cat readme.txt')output='HackLab Academy — sistema de laboratório fictício.\nParabéns! Você encontrou o relatório.';else if(normalized==='metadados foto.jpg'&&m.id==='lab4')output='Nome: foto.jpg\nDimensões: 2048x1536\nData registrada: 13/09/2026 11:42\nGPS: não registrado';else if(/^print\(["'](olá, mundo!|oi)["']\)$/iu.test(cmd)&&m.id==='lab3')output=cmd.slice(7,-2);else if(normalized==='verificar conta'&&m.id==='lab5')output='Conta demo: MFA desativado.\nDica: use "ativar mfa".';else if(normalized==='ativar mfa'&&m.id==='lab5')output='Autenticação multifator ativada na conta fictícia.';else if(m.commands.some(x=>x.toLocaleLowerCase('pt-BR')===normalized))output='Comando aceito.';termLines.push(output);let complete=normalized===m.goal.toLocaleLowerCase('pt-BR')||(m.id==='lab3'&&/^print\(["']olá, mundo!["']\)$/iu.test(cmd));if(complete){if(!state.labs.includes(m.id)){state.labs.push(m.id);save();termLines.push('✓ MISSÃO CONCLUÍDA! +'+m.reward+' XP');toast('Missão concluída! +'+m.reward+' XP');vibrate();}else termLines.push('✓ Missão já concluída.');}q('#terminalLog').textContent=termLines.slice(-40).join('\n');q('#terminalLog').scrollTop=q('#terminalLog').scrollHeight;q('#cmd').value='';}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go){navigate(b.dataset.go);return;}if(b.dataset.track){navigate('track',b.dataset.track);return;}if(b.dataset.lesson){navigate('lesson',b.dataset.lesson);return;}if(b.dataset.lab){navigate('lab',b.dataset.lab);return;}if(b.dataset.choice!==undefined){if(quizAnswered)return;vibrate();quizChoice=Number(b.dataset.choice);document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',Number(x.dataset.choice)===quizChoice));return;}if(b.id==='checkAnswer'){vibrate();checkQuiz();return;}if(b.id==='retryQuiz'){navigate('lesson',screen.id);return;}if(b.id==='nextLesson'){let ls=allLessons(),pos=ls.findIndex(l=>l.id===screen.id),next=ls[pos+1];if(next)navigate('lesson',next.id);else navigate('tracks');return;}if(b.id==='vibrationToggle'){state.vibration=!state.vibration;save();if(state.vibration)vibrate();render();toast(state.vibration?'Vibração ativada':'Vibração desativada');return;}if(b.id==='resetProgress'){vibrate();if(window.confirm('Apagar todas as aulas e missões concluídas?')){state.done=[];state.labs=[];save();navigate('profile');toast('Progresso reiniciado.');}return;}if(b.id==='terminalHelp'){vibrate();runTerminal('help');return;}if(b.id==='terminalReset'){vibrate();termLines=['Terminal limpo. Digite help.'];q('#terminalLog').textContent=termLines.join('\n');return;}});
document.addEventListener('submit',e=>{if(e.target.id==='terminalForm'){e.preventDefault();vibrate();runTerminal(q('#cmd').value);}});
render();
</script>
</body>
</html>
