name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    name: Compilar HackLab Academy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK Android
        uses: android-actions/setup-android@v3

      - name: Instalar API Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de teste instalável
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Preparar nome do APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HackLab_Academy.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: HackLab_Academy_APK
          path: HackLab_Academy.apk
          if-no-files-found: error
          retention-days: 30
